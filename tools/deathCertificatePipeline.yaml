name: death_certificate_verification
description: >
  Verifies the death certificate the user most recently uploaded against what they
  have told you about the death, then passes the case to GiveLight — accepted, or
  marked for a person to review — and returns a case reference to give the user.
  Only call this once the user has sent the certificate AND described what happened
  (who passed away, roughly when or where). If you have asked for that account twice
  without getting it, call it anyway. The image is pulled automatically; you do not
  pass it in.
input_schema:
  type: object
  properties: {}
implementation:
  type: function
  needs_context: true
  handler: tools.death_certificate_pipeline.verify.verify_death_certificate
